<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Circle -->
  <circle cx="60" cy="60" r="55" fill="url(#logoGradient)" opacity="0.1"/>
  
  <!-- Main Icon: Handshake + Shield -->
  <g filter="url(#glow)">
    <!-- Shield -->
    <path d="M60 20 L40 28 L40 50 C40 65 50 75 60 80 C70 75 80 65 80 50 L80 28 Z" 
          fill="url(#logoGradient)" opacity="0.3"/>
    <path d="M60 25 L45 31 L45 50 C45 62 52 70 60 74 C68 70 75 62 75 50 L75 31 Z" 
          stroke="url(#logoGradient)" stroke-width="2" fill="none"/>
    
    <!-- Handshake -->
    <g transform="translate(60, 60)">
      <!-- Left Hand -->
      <path d="M-15 -5 L-10 -8 L-5 -5 L-8 0 L-15 0 Z" 
            fill="#3b82f6"/>
      <!-- Right Hand -->
      <path d="M5 -5 L10 -8 L15 -5 L15 0 L8 0 Z" 
            fill="#8b5cf6"/>
      <!-- Connection -->
      <rect x="-8" y="-3" width="16" height="6" rx="1" fill="#60a5fa"/>
      <circle cx="0" cy="0" r="2" fill="#f1f5f9"/>
    </g>
  </g>
  
  <!-- Lightning Bolt (Security/Speed) -->
  <path d="M64 35 L58 48 L62 48 L58 58 L64 45 L60 45 Z" 
        fill="#fbbf24" opacity="0.8"/>
</svg>
