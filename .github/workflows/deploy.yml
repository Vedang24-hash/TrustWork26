name: CI / CD — TrustWork

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ── Job 1: Smart Contract Build & Test ────────────────────────────────────
  smart-contract:
    name: Smart Contract - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: democontract

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Install Soroban CLI
        run: |
          cargo install --locked soroban-cli --features opt || echo "Soroban CLI already installed"
          soroban --version

      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            democontract/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('democontract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust code formatting
        run: cargo fmt --check
        continue-on-error: true

      - name: Run Clippy (Rust linter)
        run: cargo clippy --all-targets --all-features -- -D warnings
        continue-on-error: true

      - name: Build smart contract (debug)
        run: cargo build --target wasm32-unknown-unknown

      - name: Build smart contract (release)
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Run tests
        run: cargo test --all-features

      - name: Optimize WASM binary
        run: |
          soroban contract optimize --wasm target/wasm32-unknown-unknown/release/trustwork_escrow.wasm
          ls -lh target/wasm32-unknown-unknown/release/*.wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: trustwork-escrow-contract
          path: democontract/target/wasm32-unknown-unknown/release/trustwork_escrow.wasm
          retention-days: 30

  # ── Job 2: Frontend Lint & Build ──────────────────────────────────────────
  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trustwork-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: trustwork-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_CONTRACT_ID:        ${{ secrets.VITE_CONTRACT_ID }}
          VITE_STELLAR_NETWORK:    ${{ secrets.VITE_STELLAR_NETWORK }}
          VITE_RPC_URL:            ${{ secrets.VITE_RPC_URL }}
          VITE_NETWORK_PASSPHRASE: ${{ secrets.VITE_NETWORK_PASSPHRASE }}
          VITE_SUPABASE_URL:       ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY:  ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: trustwork-ui/dist
          retention-days: 7

  # ── Job 3: Integration Tests ──────────────────────────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [smart-contract, frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download smart contract WASM
        uses: actions/download-artifact@v4
        with:
          name: trustwork-escrow-contract
          path: ./contract

      - name: Verify contract artifact
        run: |
          ls -lh contract/
          file contract/trustwork_escrow.wasm

      - name: Setup Node.js for integration tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Stellar SDK
        run: npm install @stellar/stellar-sdk
        working-directory: trustwork-ui

      - name: Verify frontend integration code
        run: |
          echo "Checking stellar.js for @stellar/stellar-sdk imports..."
          grep -q "@stellar/stellar-sdk" src/utils/stellar.js && echo "✓ stellar.js imports Stellar SDK" || echo "✗ Missing Stellar SDK import"
          echo "Checking contract.js exists..."
          test -f src/utils/contract.js && echo "✓ contract.js found" || echo "✗ contract.js missing"
        working-directory: trustwork-ui

  # ── Job 4: Deploy to Vercel ───────────────────────────────────────────────
  deploy:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [smart-contract, frontend, integration]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: trustwork-ui/dist

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel Production
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        working-directory: trustwork-ui
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment deployment URL
        if: github.event_name == 'push'
        run: echo "🚀 Deployed to production"
